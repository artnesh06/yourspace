<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Space — Login</title>
<link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
<div class="skeleton-screen" id="skeleton-screen">
  <div class="skeleton-header">
    <div class="skeleton-box sk-logo"></div>
    <div class="skeleton-box sk-logo-sm"></div>
  </div>
  <div class="skeleton-body">
    <div class="skeleton-box sk-title"></div>
    <div class="skeleton-card">
      <div class="skeleton-box sk-tab"></div>
      <div class="skeleton-box sk-input"></div>
      <div class="skeleton-box sk-input"></div>
      <div class="skeleton-box sk-btn"></div>
    </div>
    <div class="skeleton-box sk-subtitle"></div>
  </div>
</div>

<main class="landing-gate" id="landing-gate" style="display:none">
  <div class="dither-bg" id="dither-bg"></div>
  <header class="landing-header">
    <a href="https://www.sinarmas.co.id/personal" target="_blank" rel="noopener" class="landing-logo-link">
      <img class="landing-logo-tl" src="https://res.cloudinary.com/dugfzrnpy/image/upload/v1778640245/SINARMAS_LOGO-08_ytqcwo.png" alt="Asuransi Sinarmas">
    </a>
    <a href="https://www.instagram.com/lifeatasm/" target="_blank" rel="noopener" class="landing-logo-link">
      <img class="landing-logo-tr" src="https://res.cloudinary.com/dugfzrnpy/image/upload/v1778640245/SINARMAS_LOGO-07_m4k3bu.png" alt="Life at ASM">
    </a>
  </header>
  <section class="landing-panel" aria-label="Your Space login">
    <h1 class="landing-title">YOUR SPACE</h1>

    <div class="auth-box" id="auth-box">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Log in</button>
        <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Daftar</button>
      </div>

      <form class="auth-form" id="form-login" onsubmit="handleLogin(event)">
        <input type="email" id="login-email" placeholder="Email" required autocomplete="email">
        <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="auth-submit-btn">Sign in</button>
        <p class="auth-msg" id="login-msg"></p>
      </form>

      <form class="auth-form auth-form-hidden" id="form-register" onsubmit="handleRegister(event)">
        <input type="email" id="reg-email" placeholder="Email" required autocomplete="email">
        <input type="password" id="reg-password" placeholder="Password (min 6 karakter)" required minlength="6" autocomplete="new-password">
        <input type="password" id="reg-password2" placeholder="Konfirmasi password" required minlength="6" autocomplete="new-password">
        <button type="submit" class="auth-submit-btn">Daftar</button>
        <p class="auth-msg" id="reg-msg"></p>
      </form>
    </div>

    <p class="landing-subtitle">Build with <span class="landing-heart" aria-hidden="true">&#10084;</span> by culture division</p>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
<script src="js/dither-bg.js"></script>
<script>
// If already logged in, go to app
(function(){
  let session = null;
  try{
    session = localStorage.getItem('asm_session');
  }catch(_err){
    session = null;
  }
  if(session){
    window.location.href = 'app.html';
    return;
  }
  // Show landing, hide skeleton
  document.getElementById('skeleton-screen').style.display='none';
  document.getElementById('landing-gate').style.display='flex';
})();
</script>
</body>
</html>
