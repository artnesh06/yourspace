<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workboard — ASM Space</title>
<link rel="stylesheet" href="css/style.css?v=24">
</head>
<body>
<div class="skeleton-screen" id="skeleton-screen">
  <div class="skeleton-header sk-header-app">
    <div class="skeleton-box sk-topbar"></div>
  </div>
  <div class="skeleton-body-app">
    <div class="skeleton-box sk-col"></div>
    <div class="skeleton-box sk-col"></div>
    <div class="skeleton-box sk-col"></div>
    <div class="skeleton-box sk-col"></div>
  </div>
</div>

<div class="app-shell" id="app-shell" style="display:none">
  <div class="dither-bg dither-bg-app" id="dither-bg-app"></div>
  <div class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo-dot"></span>
      <span class="topbar-logo-text">Workboard</span>
    </div>

    <div class="view-toggle">
      <button class="vt-btn active" id="vt-kanban" onclick="switchView('kanban')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/></svg>
        Kanban
      </button>
      <button class="vt-btn" id="vt-kalender" onclick="switchView('kalender')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Kalender
      </button>
    </div>

    <div class="topbar-right">
      <div class="topbar-right-group" id="topbar-kanban-right">
        <button class="tb-btn" onclick="resetLocalData()" title="Reset data">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Reset
        </button>
        <button class="tb-btn tb-btn-strong" onclick="openNewCol()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add column
        </button>
      </div>

      <div class="topbar-right-group" id="topbar-cal-right" style="display:none">
        <button class="tb-btn" onclick="prevMonth()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="nav-month" id="nav-month-label"></span>
        <button class="tb-btn" onclick="nextMonth()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="tb-btn" onclick="goToday()">Today</button>
      </div>

      <button class="tb-btn" onclick="handleLogout()" title="Logout">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>

  <div class="view active" id="view-kanban">
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
  </div>

  <div class="view" id="view-kalender">
    <div class="cal-wrap">
      <div class="day-headers">
        <div class="day-header sun">Sun</div>
        <div class="day-header">Mon</div>
        <div class="day-header">Tue</div>
        <div class="day-header">Wed</div>
        <div class="day-header">Thu</div>
        <div class="day-header">Fri</div>
        <div class="day-header sat">Sat</div>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal-box"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js?v=22"></script>
<script src="js/dither-bg.js"></script>
<script>
// Auth guard + skeleton hide
(function(){
  let session = null;
  try{
    session = localStorage.getItem('asm_session');
  }catch(_err){
    session = null;
  }
  if(!session){
    session = JSON.stringify({email:'Local mode',createdAt:new Date().toISOString(),mode:'local'});
    try{localStorage.setItem('asm_session',session)}catch(_err){}
  }
  document.getElementById('skeleton-screen').style.display='none';
  document.getElementById('app-shell').style.display='';
})();
</script>
</body>
</html>
